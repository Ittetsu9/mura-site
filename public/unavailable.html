<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>ただいま非公開です</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f1e8;
        color: #253126;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(560px, 100%);
        padding: 48px 32px;
        border: 1px solid #d8d0c0;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.7);
        text-align: center;
        box-shadow: 0 18px 60px rgba(57, 67, 49, 0.08);
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        letter-spacing: 0.04em;
      }
      p {
        margin: 0;
        color: #5d685e;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ただいま非公開です</h1>
      <p>公開再開まで、しばらくお待ちください。</p>
    </main>
  </body>
</html>
